<!DOCTYPE html>
<!-- This file is for wms functionality currently not is use (per 18 March) -->
<html lang="en">
<head>
    <title>WMS - NIBIO Treslag</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: {
            version: 8,
            sources: {},
            layers: []
        },
        zoom: 5,
        center: [15,65]
    });

    map.on('load', () => {
    map.addSource('treslag-wms', {
      type: 'raster',
      tiles: [
        'https://wms.nibio.no/cgi-bin/ar5?' +
        'SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&' +
        'LAYERS=Treslag&STYLES=&CRS=EPSG:4258&' +
        'FORMAT=image/png&TRANSPARENT=TRUE&' +
        'WIDTH=256&HEIGHT=256&' +
        'BBOX={bbox-epsg-4258}'
      ],
      tileSize: 256
    });

    map.addLayer({
      id: 'treslag-layer',
      type: 'raster',
      source: 'treslag-wms'
    });
  });
</script>
</body>
</html>
